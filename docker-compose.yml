services:
  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - public

  server:
    build: ./server
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 256m
    networks:
      - public
      - private

  redis:
    image: redis:alpine
    expose:
      - "6379"
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - redis_data:/data
    networks:
      - private

volumes:
  redis_data:

networks:
  public:
    driver: bridge
  private:
    driver: bridge
    internal: true
